[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opencode-go-monitor"
version = "0.1.0"
description = "Native Linux monitor for OpenCode Go usage"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ocgm = "ocgm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ocgm = ["ui/style.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
